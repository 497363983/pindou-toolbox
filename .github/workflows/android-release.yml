name: Android Release

# 推 v* 标签自动发布，或在 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本号（建议以 v 开头，如 v1.0.0）'
        required: true
        default: 'v1.0.0'

# 创建/更新 Release 需要写入权限
permissions:
  contents: write

jobs:
  build:
    name: 构建并发布 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          echo "发布版本：${{ steps.ver.outputs.tag }}"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.1.12297006

      - name: 安装依赖
        run: npm ci

      - name: 生成原生工程（expo prebuild）
        run: npx expo prebuild --platform android

      - name: 构建 arm64 APK（真机版）
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: 重命名 arm64 APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             "pindou-arm64-${{ steps.ver.outputs.tag }}.apk"

      - name: 构建通用 APK（全 ABI）
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 --no-daemon

      - name: 重命名通用 APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             "pindou-universal-${{ steps.ver.outputs.tag }}.apk"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pindou-apks-${{ steps.ver.outputs.tag }}
          path: pindou-*.apk
          if-no-files-found: error

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            pindou-arm64-*.apk
            pindou-universal-*.apk
